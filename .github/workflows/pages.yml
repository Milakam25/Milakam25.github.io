name: Deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure contact form
        env:
          FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID || 'mvkznlyr' }}
          FORMSPREE_ENDPOINT: ${{ vars.FORMSPREE_ENDPOINT }}
        run: node tools/build-contact-config.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html 404.html favicon.ico _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
