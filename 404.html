<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#edf8f4"/>
  <title>Page Not Found | Mila Kam</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #edf8f4; color: #172b2b; }
    main { width: min(620px, 100%); padding: clamp(36px, 7vw, 72px); text-align: center; background: #fffdfd; border: 1px solid #cce5dc; border-radius: 12px; box-shadow: 0 16px 50px rgba(23,43,43,.08); }
    p:first-child { margin: 0 0 12px; color: #32846c; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 18px; font-size: clamp(2.4rem, 8vw, 4.6rem); line-height: 1; }
    h1 span { color: #c74f79; }
    .message { margin: 0 auto 30px; max-width: 34rem; color: #536a6a; line-height: 1.7; }
    a { display: inline-block; padding: 12px 24px; border-radius: 4px; background: #c74f79; color: white; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { background: #a93b63; }
  </style>
</head>
<body>
  <main>
    <p>Error 404</p>
    <h1>Page not <span>found.</span></h1>
    <p class="message">The page may have moved or the address may be incorrect. Return to the portfolio to continue exploring.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
